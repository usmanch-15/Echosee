org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.incremental=false
android.enableResourceOnlyAars=true
android.gradle.plugin.agp.namespace.skip=true
kotlin.jvmTarget=17
android.compileOptions.sourceCompatibility=17
android.compileOptions.targetCompatibility=17
# Disable JVM target validation due to plugin version conflicts
kotlin.jvm.target.validation.mode=ignore
kotlin.suppress.kcmpp=true
suppressKotlinCompilerJvmTargetValidation=true
